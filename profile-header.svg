<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Lizhengzhong — NLP and AI Agents</title>
  <desc id="desc">A light glassmorphism profile header featuring NLP, agent workflows and a subtle time-series signal.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFDFF"/>
      <stop offset="0.48" stop-color="#F1F7FF"/>
      <stop offset="1" stop-color="#F8F4FF"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9DDAFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9DDAFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lilacGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#CEBCFF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#CEBCFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A9EDD9" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#A9EDD9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.46"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#DCE9F8"/>
      <stop offset="1" stop-color="#DCCEFF"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#82BDEA"/>
      <stop offset="0.52" stop-color="#9A8DE6"/>
      <stop offset="1" stop-color="#69CDB3"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#91A8C8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#728BB0" flood-opacity="0.15"/>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="8" y="8" width="1184" height="344" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="1184" height="344" rx="34" fill="url(#bg)"/>
    <rect x="8" y="8" width="1184" height="344" rx="34" fill="url(#grid)"/>
    <ellipse cx="126" cy="40" rx="310" ry="210" fill="url(#blueGlow)"/>
    <ellipse cx="612" cy="-18" rx="330" ry="190" fill="url(#lilacGlow)"/>
    <ellipse cx="1110" cy="340" rx="350" ry="230" fill="url(#mintGlow)"/>

    <g filter="url(#shadow)">
      <rect x="42" y="38" width="678" height="284" rx="34" fill="url(#glass)" stroke="url(#glassStroke)" stroke-width="1.2"/>
      <path d="M78 58H678" stroke="#FFFFFF" stroke-opacity="0.94" stroke-linecap="round"/>
    </g>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif">
      <rect x="76" y="70" width="254" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.70" stroke="#DCEAF7"/>
      <circle cx="96" cy="88" r="4" fill="#65CDB1" filter="url(#tinyGlow)"/>
      <text x="110" y="93" fill="#71809D" font-size="13" font-weight="650" letter-spacing="2">HELLO, I'M LIZHENGZHONG</text>

      <text x="76" y="166" fill="#273550" font-size="52" font-weight="720" letter-spacing="0.7">NLP × AI AGENTS</text>
      <text x="78" y="207" fill="#465672" font-size="21" font-weight="560">让语言模型听懂人话，也让智能体把事情做完。</text>
      <text x="78" y="239" fill="#7A88A2" font-size="15">时序建模是支线任务：偶尔偷看一下“下一秒”。</text>

      <g font-size="12" font-weight="700" letter-spacing="0.7">
        <rect x="76" y="269" width="92" height="34" rx="17" fill="#E8F6FF" stroke="#BDE3F8"/>
        <text x="103" y="291" fill="#397CA7">NLP</text>
        <rect x="178" y="269" width="130" height="34" rx="17" fill="#F1EDFF" stroke="#D6CAFF"/>
        <text x="203" y="291" fill="#7464B5">AI AGENTS</text>
        <rect x="318" y="269" width="146" height="34" rx="17" fill="#EAF9F4" stroke="#BFECDD"/>
        <text x="341" y="291" fill="#438F7C">TIME SERIES</text>
      </g>
    </g>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" filter="url(#shadow)">
      <rect x="760" y="50" width="392" height="260" rx="34" fill="url(#glass)" stroke="url(#glassStroke)" stroke-width="1.2"/>
      <path d="M794 76H1118" stroke="#FFFFFF" stroke-opacity="0.96" stroke-linecap="round"/>
      <text x="794" y="101" fill="#8090A8" font-size="11" font-weight="700" letter-spacing="2">AGENT WORKFLOW</text>

      <g fill="none" stroke="url(#signal)" stroke-width="2.5" stroke-linecap="round">
        <path d="M817 157C854 157 865 128 904 128C944 128 957 174 994 174C1030 174 1043 139 1084 139"/>
        <path d="M904 148V223M994 194V223" stroke-opacity="0.42" stroke-dasharray="4 6"/>
      </g>

      <g font-size="10.5" font-weight="750" letter-spacing="1">
        <g>
          <circle cx="808" cy="157" r="18" fill="#F8FCFF" stroke="#A8D9F4" stroke-width="2"/>
          <circle cx="808" cy="157" r="5" fill="#7BBDE5"/>
          <text x="784" y="191" fill="#70819C">TEXT</text>
        </g>
        <g>
          <circle cx="904" cy="128" r="22" fill="#FBF9FF" stroke="#C8BAF5" stroke-width="2"/>
          <circle cx="904" cy="128" r="6" fill="#9A8DE6"/>
          <text x="882" y="164" fill="#6F7E97">AGENT</text>
        </g>
        <g>
          <circle cx="994" cy="174" r="22" fill="#F7FCFF" stroke="#ABDDF3" stroke-width="2"/>
          <circle cx="994" cy="174" r="6" fill="#76BFE0"/>
          <text x="975" y="208" fill="#6F7E97">TOOL</text>
        </g>
        <g>
          <circle cx="1092" cy="139" r="18" fill="#F7FEFB" stroke="#A9E2D2" stroke-width="2"/>
          <circle cx="1092" cy="139" r="5" fill="#65C5AC"/>
          <text x="1066" y="104" fill="#70819C">DONE</text>
        </g>
      </g>

      <g>
        <rect x="796" y="245" width="320" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.67" stroke="#DDE9F5"/>
        <path d="M815 262H836L845 253L855 271L865 258L876 262H899L908 256L919 267L931 262H955L964 251L976 273L987 258L999 262H1023L1032 256L1044 269L1056 261H1098" fill="none" stroke="url(#signal)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <rect x="8.5" y="8.5" width="1183" height="343" rx="33.5" fill="none" stroke="#DDE8F5"/>
</svg>
