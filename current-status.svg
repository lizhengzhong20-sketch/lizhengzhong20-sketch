<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Current developer status</title>
  <desc id="desc">Three light glass cards showing the main quest, side quest and current project.</desc>
  <defs>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4FAFF"/>
      <stop offset="1" stop-color="#EAF5FF"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9FF"/>
      <stop offset="1" stop-color="#F1EDFF"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6FEFB"/>
      <stop offset="1" stop-color="#EAF9F4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#7C91B2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif" filter="url(#shadow)">
    <g>
      <rect x="18" y="20" width="372" height="180" rx="30" fill="url(#cardA)" stroke="#D6EAF8"/>
      <rect x="44" y="44" width="98" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.82" stroke="#D8EAF7"/>
      <text x="61" y="63" fill="#70829A" font-size="11" font-weight="750" letter-spacing="1.4">MAIN QUEST</text>
      <circle cx="350" cy="58" r="16" fill="#DDF2FF"/>
      <text x="342" y="63" fill="#4E91BB" font-size="13" font-weight="750">01</text>
      <text x="44" y="116" fill="#2E4864" font-size="25" font-weight="720">NLP + AI AGENTS</text>
      <text x="44" y="153" fill="#718199" font-size="15">让模型会说，也让 Agent 会做。</text>
    </g>

    <g>
      <rect x="414" y="20" width="372" height="180" rx="30" fill="url(#cardB)" stroke="#E1D9FA"/>
      <rect x="440" y="44" width="92" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.82" stroke="#E3DDF6"/>
      <text x="457" y="63" fill="#7A7197" font-size="11" font-weight="750" letter-spacing="1.4">SIDE QUEST</text>
      <circle cx="746" cy="58" r="16" fill="#E9E2FF"/>
      <text x="738" y="63" fill="#7A69B9" font-size="13" font-weight="750">02</text>
      <text x="440" y="116" fill="#453F63" font-size="25" font-weight="720">TIME SERIES</text>
      <text x="440" y="153" fill="#7E7792" font-size="15">顺手研究一下“下一秒”。</text>
    </g>

    <g>
      <rect x="810" y="20" width="372" height="180" rx="30" fill="url(#cardC)" stroke="#D4EEE6"/>
      <rect x="836" y="44" width="82" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.82" stroke="#D8EEE8"/>
      <text x="854" y="63" fill="#66877E" font-size="11" font-weight="750" letter-spacing="1.4">BUILDING</text>
      <circle cx="1142" cy="58" r="16" fill="#DDF5ED"/>
      <text x="1134" y="63" fill="#4C937F" font-size="13" font-weight="750">03</text>
      <text x="836" y="116" fill="#31594F" font-size="25" font-weight="720">SCALARPULSE</text>
      <text x="836" y="153" fill="#6E8982" font-size="15">给训练过程装一扇透明窗。</text>
    </g>
  </g>
</svg>
