<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Lizhengzhong current lab status</title>
  <desc id="desc">Light glass cards showing ScalarPulse, LLM agent learning, agent evaluation, and time series as a small side exploration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFDFF"/>
      <stop offset="0.5" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#FAF7FF"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#EAF6FF" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#F1EDFF" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#EAF9F4" stop-opacity="0.80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-35%" width="140%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7388A8" flood-opacity="0.12"/>
    </filter>
    <clipPath id="frame"><rect x="8" y="8" width="1184" height="214" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="1184" height="214" rx="34" fill="url(#bg)"/>
    <circle cx="130" cy="18" r="130" fill="#BFE6FF" fill-opacity="0.22"/>
    <circle cx="1100" cy="214" r="150" fill="#C7F0E2" fill-opacity="0.24"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif" filter="url(#shadow)">
      <g>
        <rect x="26" y="27" width="370" height="176" rx="28" fill="url(#cardA)" stroke="#D4E9F8"/>
        <rect x="50" y="49" width="62" height="26" rx="13" fill="#E6F5FF" stroke="#C8E7F8"/>
        <text x="70" y="67" fill="#4E8DB3" font-size="11" font-weight="800" letter-spacing="1.5">NOW</text>
        <circle cx="355" cy="62" r="6" fill="#65CDB1"/>
        <circle cx="355" cy="62" r="12" fill="none" stroke="#65CDB1" stroke-opacity="0.25"/>
        <text x="50" y="116" fill="#2D4963" font-size="27" font-weight="760">SCALARPULSE</text>
        <text x="50" y="148" fill="#687F95" font-size="14.5">Python · 训练指标可观测性</text>
        <text x="50" y="177" fill="#8A9BAE" font-size="12.5">把 loss、延迟与 Token 用量画出来</text>
      </g>

      <g>
        <rect x="415" y="27" width="370" height="176" rx="28" fill="url(#cardB)" stroke="#DED7F6"/>
        <rect x="439" y="49" width="92" height="26" rx="13" fill="#F0ECFF" stroke="#DCD3FA"/>
        <text x="456" y="67" fill="#7768B3" font-size="11" font-weight="800" letter-spacing="1.35">LEARNING</text>
        <text x="439" y="116" fill="#453F63" font-size="27" font-weight="760">LLM + AGENTS</text>
        <text x="439" y="148" fill="#766E8E" font-size="14.5">RAG · Tool Calling · Memory</text>
        <text x="439" y="177" fill="#9991A8" font-size="12.5">让模型从“会说”走向“会做”</text>
      </g>

      <g>
        <rect x="804" y="27" width="370" height="176" rx="28" fill="url(#cardC)" stroke="#D0ECE3"/>
        <rect x="828" y="49" width="64" height="26" rx="13" fill="#E7F8F2" stroke="#CDECE2"/>
        <text x="846" y="67" fill="#4E927F" font-size="11" font-weight="800" letter-spacing="1.45">NEXT</text>
        <text x="828" y="116" fill="#31594F" font-size="27" font-weight="760">AGENT EVAL</text>
        <text x="828" y="148" fill="#67877E" font-size="14.5">Success · Latency · Tokens</text>
        <rect x="828" y="163" width="188" height="25" rx="12.5" fill="#FFFFFF" fill-opacity="0.72" stroke="#D5EBE4"/>
        <text x="846" y="180" fill="#82958F" font-size="10.5" font-weight="700" letter-spacing="0.8">SIDE LAB · TIME SERIES</text>
      </g>
    </g>
  </g>

  <rect x="8.5" y="8.5" width="1183" height="213" rx="33.5" fill="none" stroke="#DEE8F4"/>
</svg>
