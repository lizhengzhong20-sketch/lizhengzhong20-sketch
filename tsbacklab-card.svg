<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">TSBackLab — 不会骗你的时序回测工作台</title>
  <desc id="desc">A light glassmorphism project card for TSBackLab, showing a rolling backtest chart with a truth line, forecast segments issued at successive cutoffs, point-in-time snapshots, a frozen task bill, and fair own/common scoring.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFDFF"/>
      <stop offset="0.52" stop-color="#F2F8FF"/>
      <stop offset="1" stop-color="#F8F4FF"/>
    </linearGradient>
    <radialGradient id="skyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9EDCFF" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#9EDCFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C9BBFF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#C9BBFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A9ECD8" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#A9ECD8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="0.56" stop-color="#FFFFFF" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.50" stop-color="#DCEAF7"/>
      <stop offset="1" stop-color="#D7CEF8"/>
    </linearGradient>
    <linearGradient id="truthLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69BEEB"/>
      <stop offset="0.48" stop-color="#8B8BE8"/>
      <stop offset="1" stop-color="#61C7AA"/>
    </linearGradient>
    <linearGradient id="truthFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A9BEA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8A9BEA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="microGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#849AB7" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="chartGrid" width="53" height="36" patternUnits="userSpaceOnUse">
      <path d="M53 0H0V36" fill="none" stroke="#9AAAC0" stroke-opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7089AA" flood-opacity="0.16"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="8" y="8" width="1184" height="284" rx="34"/>
    </clipPath>
    <clipPath id="chartClip">
      <rect x="786" y="123" width="340" height="104" rx="15"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="1184" height="284" rx="34" fill="url(#background)"/>
    <rect x="8" y="8" width="1184" height="284" rx="34" fill="url(#microGrid)"/>
    <ellipse cx="80" cy="20" rx="285" ry="190" fill="url(#skyGlow)"/>
    <ellipse cx="638" cy="-42" rx="300" ry="160" fill="url(#violetGlow)"/>
    <ellipse cx="1110" cy="305" rx="350" ry="210" fill="url(#mintGlow)"/>

    <g filter="url(#shadow)">
      <rect x="38" y="32" width="682" height="236" rx="30" fill="url(#glass)" stroke="url(#glassStroke)" stroke-width="1.2"/>
      <path d="M70 50H688" stroke="#FFFFFF" stroke-opacity="0.92" stroke-linecap="round"/>
    </g>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif">
      <g transform="translate(70 58)">
        <rect width="196" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.74" stroke="#D8E8F4"/>
        <circle cx="17" cy="14" r="4" fill="#64CBAE" filter="url(#softGlow)"/>
        <text x="30" y="18" fill="#71809A" font-size="10.5" font-weight="750" letter-spacing="1.4">BACKTEST · NO LEAKAGE</text>
      </g>

      <text x="70" y="137" fill="#263651" font-size="42" font-weight="780" letter-spacing="0.3">TSBackLab</text>
      <text x="70" y="169" fill="#53627B" font-size="18" font-weight="600">不会骗你的时序回测工作台</text>

      <g font-size="11.5" font-weight="700">
        <g transform="translate(70 193)">
          <rect width="170" height="34" rx="17" fill="#EAF7FF" stroke="#C3E5F8"/>
          <circle cx="18" cy="17" r="4" fill="#63B9E5"/>
          <text x="31" y="21" fill="#3E789C">Point-in-time data</text>
        </g>
        <g transform="translate(250 193)">
          <rect width="154" height="34" rx="17" fill="#F2EEFF" stroke="#D8CCFA"/>
          <circle cx="18" cy="17" r="4" fill="#9384DF"/>
          <text x="31" y="21" fill="#6B60A5">Frozen task bill</text>
        </g>
        <g transform="translate(414 193)">
          <rect width="162" height="34" rx="17" fill="#EAF9F4" stroke="#C0EBDD"/>
          <circle cx="18" cy="17" r="4" fill="#61BFA4"/>
          <text x="31" y="21" fill="#438C79">Fair own/common</text>
        </g>
      </g>

      <g font-size="10.5" font-weight="760" letter-spacing="0.6">
        <g transform="translate(70 237)">
          <rect width="118" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.68" stroke="#D9E6F2"/>
          <text x="17" y="16" fill="#60718D">PYTHON 3.11</text>
        </g>
        <g transform="translate(196 237)">
          <rect width="146" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.68" stroke="#D9E6F2"/>
          <text x="17" y="16" fill="#786CAC">CLI · SDK · WEB</text>
        </g>
      </g>
    </g>

    <g filter="url(#shadow)">
      <rect x="748" y="32" width="414" height="236" rx="30" fill="url(#glass)" stroke="url(#glassStroke)" stroke-width="1.2"/>
      <path d="M778 50H1132" stroke="#FFFFFF" stroke-opacity="0.94" stroke-linecap="round"/>
    </g>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <text x="780" y="77" fill="#7D8CA4" font-size="10.5" font-weight="760" letter-spacing="1.65">ROLLING BACKTEST</text>
      <g transform="translate(1044 60)">
        <rect width="86" height="24" rx="12" fill="#EAF9F4" stroke="#BDE8DA"/>
        <circle cx="14" cy="12" r="3.5" fill="#5CC2A4" filter="url(#softGlow)"/>
        <text x="25" y="15.5" fill="#4A8C7B" font-size="9.5" font-weight="760" letter-spacing="0.8">42 TASKS</text>
      </g>

      <g>
        <rect x="780" y="93" width="116" height="23" rx="11.5" fill="#FFFFFF" fill-opacity="0.62" stroke="#DEE9F3"/>
        <text x="794" y="108" fill="#70809A" font-size="10" font-weight="680">models</text>
        <text x="851" y="108" fill="#626FD1" font-size="10" font-weight="760">3</text>
        <rect x="904" y="93" width="104" height="23" rx="11.5" fill="#FFFFFF" fill-opacity="0.62" stroke="#DEE9F3"/>
        <text x="918" y="108" fill="#70809A" font-size="10" font-weight="680">truth</text>
        <text x="959" y="108" fill="#52637E" font-size="10" font-weight="760">frozen</text>
      </g>

      <rect x="780" y="117" width="352" height="116" rx="17" fill="#FBFDFF" fill-opacity="0.66" stroke="#DCE8F3"/>
      <g clip-path="url(#chartClip)">
        <rect x="786" y="123" width="340" height="104" fill="url(#chartGrid)"/>

        <path d="M786 190 C810 185 820 200 846 195 C872 190 880 172 906 176 C932 180 944 198 970 194 C996 190 1006 170 1032 172 C1058 174 1070 192 1096 188 C1108 186 1118 196 1126 193 L1126 227 L786 227 Z" fill="url(#truthFill)"/>

        <g stroke="#AFC2D6" stroke-width="1.2" stroke-dasharray="1.5 3.5">
          <path d="M880 130V223"/>
          <path d="M970 130V223"/>
          <path d="M1060 130V223"/>
        </g>

        <path d="M880 178 C905 170 940 186 966 193" fill="none" stroke="#9384DF" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round" stroke-opacity="0.92"/>
        <path d="M970 194 C995 184 1032 178 1058 176" fill="none" stroke="#63B9E5" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round" stroke-opacity="0.92"/>
        <path d="M1060 177 C1080 170 1110 184 1124 188" fill="none" stroke="#61BFA4" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round" stroke-opacity="0.92"/>

        <path d="M786 190 C810 185 820 200 846 195 C872 190 880 172 906 176 C932 180 944 198 970 194 C996 190 1006 170 1032 172 C1058 174 1070 192 1096 188 C1108 186 1118 196 1126 193" fill="none" stroke="url(#truthLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

        <g fill="#8FA2B8">
          <circle cx="880" cy="178" r="3.4" fill="#FFFFFF" stroke="#9384DF" stroke-width="2"/>
          <circle cx="970" cy="194" r="3.4" fill="#FFFFFF" stroke="#63B9E5" stroke-width="2"/>
          <circle cx="1060" cy="177" r="3.4" fill="#FFFFFF" stroke="#61BFA4" stroke-width="2"/>
        </g>
        <circle cx="1126" cy="193" r="4.5" fill="#63C6AA" stroke="#FFFFFF" stroke-width="2" filter="url(#softGlow)"/>
      </g>

      <g transform="translate(780 241)" font-size="9.5" font-weight="700">
        <path d="M2 7H18" stroke="url(#truthLine)" stroke-width="2.5" stroke-linecap="round"/>
        <text x="25" y="10" fill="#71809A">truth</text>
        <path d="M62 7H78" stroke="#9384DF" stroke-width="2.2" stroke-dasharray="4 3" stroke-linecap="round"/>
        <text x="85" y="10" fill="#71809A">forecast</text>
        <circle cx="152" cy="7" r="3" fill="#FFFFFF" stroke="#8FA2B8" stroke-width="1.6"/>
        <text x="160" y="10" fill="#71809A">cutoff</text>
        <text x="314" y="10" fill="#8794A9">rolling</text>
      </g>
    </g>
  </g>

  <rect x="8.5" y="8.5" width="1183" height="283" rx="33.5" fill="none" stroke="#DCE8F4"/>
</svg>
